# City -> primary IATA airport code.
#
# Used by the fast flight tier (backend/nodes/search.py) to turn a spoken city
# name into the `departure_id` / `arrival_id` the Google Flights API expects.
#
# Two rules govern this file:
#
# 1. NEVER GUESS. A city that is not listed here resolves to None, and the fast
#    fare lookup is skipped with a visible message, rather than being sent a
#    fabricated code. The old behaviour took the first three letters of the city
#    name ("Bhubaneswar" -> "BHU", which is Bhatinda) and returned confident
#    fares for the wrong airport. A missing entry is a gap; a wrong entry is a
#    lie. Add cities here rather than reintroducing a fallback.
#
# 2. ONE PRIMARY AIRPORT PER CITY. Multi-airport metros (London, Paris, Tokyo,
#    New York, Moscow, Milan, Bangkok, Shanghai...) are mapped to the single
#    busiest international gateway, NOT to the metro code (LON/PAR/TYO/NYC).
#    Metro codes are not accepted by every Google Flights query, and silently
#    returning one changes what the user is shown. If you need the secondary
#    airport, add it under its own name (e.g. `gatwick: LGW`).
#
# Keys are matched lowercase and whitespace-stripped. Aliases (bombay/mumbai,
# calicut/kozhikode) are listed as separate keys pointing at the same code.
#
# The values here also form the set of codes accepted when a user types an
# airport code directly ("BLR") instead of a city name — so an unknown
# three-letter string still fails loudly instead of being passed through.

airports:
  # ── India — metros ────────────────────────────────────────────────
  mumbai: BOM
  bombay: BOM
  delhi: DEL
  new delhi: DEL
  bangalore: BLR
  bengaluru: BLR
  hyderabad: HYD
  chennai: MAA
  madras: MAA
  kolkata: CCU
